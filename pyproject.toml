[project]
name = "koewake"
version = "0.1.0"
description = "動画から日本語のSRT字幕を自動生成する（Filmora取り込み用）"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "nano72mkn" }]

dependencies = [
    "faster-whisper>=1.1.0",
    "imageio-ffmpeg>=0.5.1",
    # 話者分離（Phase 2）。PyTorch も HuggingFace のトークンも要らない。
    #
    # sherpa-onnx の wheel はネイティブライブラリを含まず（2MBしかない）、
    # 実体は sherpa-onnx-core にある。ところが wheel のメタデータに
    # その依存が書かれていないため、uv が core を入れてくれず、
    # import が libonnxruntime 不足で落ちる。
    # 直るまでは core を明示的に、同じバージョンで指定しておく。
    "sherpa-onnx==1.13.6",
    "sherpa-onnx-core==1.13.6",
    "numpy>=1.24",
]

[project.optional-dependencies]
# NVIDIA GPU で動かすための CUDA ライブラリ（Windows / Linux）。
# faster-whisper の wheel には入っていないので、別に入れる必要がある。
# 合計 1GB 近くあり、GPU が無ければ完全に無駄なので既定では入れない。
# macOS には NVIDIA GPU が無く wheel も無いので、そこでは何も入れない。
cuda = [
    "nvidia-cublas-cu12>=12.3; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9.1,<10; sys_platform != 'darwin'",
]

[project.scripts]
koewake = "koewake.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/koewake"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "PL"]
ignore = [
    # CUDA の有無を調べるだけなので、何が起きても CPU にフォールバックさせたい
    "BLE001",
    "PLR2004",
    # 日本語のコード。全角の約物を「紛らわしい文字」として弾かれても困る
    "RUF001",
    "RUF002",
    "RUF003",
    # 重い依存(faster-whisper / ctranslate2)は、使うときだけ読み込みたい
    "PLC0415",
]
