[project]
name = "koewake"
version = "0.1.0"
description = "動画から日本語のSRT字幕を自動生成する（Filmora取り込み用）"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "nano72mkn" }]

dependencies = [
    "faster-whisper>=1.1.0",
    "imageio-ffmpeg>=0.5.1",
]

[project.scripts]
koewake = "koewake.cli:run"

[project.optional-dependencies]
# Phase 2 (話者分離) 用。Phase 1 では不要。
diarize = ["sherpa-onnx>=1.10.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/koewake"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "PL"]
ignore = [
    # CUDA の有無を調べるだけなので、何が起きても CPU にフォールバックさせたい
    "BLE001",
    "PLR2004",
    # 日本語のコード。全角の約物を「紛らわしい文字」として弾かれても困る
    "RUF001",
    "RUF002",
    "RUF003",
    # 重い依存(faster-whisper / ctranslate2)は、使うときだけ読み込みたい
    "PLC0415",
]
